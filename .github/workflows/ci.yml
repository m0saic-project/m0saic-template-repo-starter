# Lane A — policy + loader-contract checks against the COMMITTED artifacts.
# Pure Node, no npm install, fork-safe: works on a bare clone, because dist/
# and template-manifest.json are committed and tools/*.mjs use only builtins.
#
# Lane B (build + lint + jest + dist-freshness) needs the private m0saic
# monorepo checked out as a SIBLING (the package.json file: links) via a PAT
# secret. It is deliberately not wired yet — see the commented job below and
# docs/publish.md. Until then, `npm run verify` on the dev machines is the
# build gate (run it on Windows AND macOS before tagging).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency + pack policy
        run: node tools/check-deps.mjs
      - name: Loader contract (committed dist + manifest)
        run: node tools/contract-check.mjs

  # Lane C — the signed release. Every push to main is a signed mint
  # (release.json = ed25519 over the tree hash, verified against keys/);
  # a merged change that touched dist/ or the manifests without a re-sign
  # turns this red by design. Tag pushes also require the tag to exist.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release.json (ed25519 over the tree hash) against keys/
        run: node tools/verify-release.mjs ${{ startsWith(github.ref, 'refs/tags/') && '--require-tag' || '' }}

